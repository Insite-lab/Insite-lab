# Auto-update README with latest stats
name: Update README Stats

on:
  schedule:
    - cron: "0 0 * * *"  # Run daily at midnight
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Organization Stats
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const repos = await github.paginate(
              github.rest.repos.listForOrg,
              { org: context.repo.owner, per_page: 100 }
            );

            const totalStars = repos.reduce((sum, repo) => sum + repo.stargazers_count, 0);
            const totalForks = repos.reduce((sum, repo) => sum + repo.forks_count, 0);
            const totalRepos = repos.length;

            console.log(`📊 Organization Stats:`);
            console.log(`   Total Repositories: ${totalRepos}`);
            console.log(`   Total Stars: ${totalStars}`);
            console.log(`   Total Forks: ${totalForks}`);

            // You can update README or store these as env vars for other steps
            core.exportVariable('TOTAL_REPOS', totalRepos);
            core.exportVariable('TOTAL_STARS', totalStars);
            core.exportVariable('TOTAL_FORKS', totalForks);
